name: Sync BetterGI blacklist

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Republish the current BetterGI Release even if already recorded
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: sync-bettergi-blacklist
  cancel-in-progress: false

jobs:
  sync:
    name: Verify, mirror, and publish blacklist
    runs-on: ubuntu-latest
    environment: catalog-publish
    concurrency:
      group: publish-catalog
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Read currently published resource metadata
        shell: bash
        run: |
          mkdir -p artifacts/bettergi-blacklist
          git fetch origin catalog
          git show \
            origin/catalog:plugins/akasha-genshin-automation/resources.json \
            > artifacts/bettergi-blacklist/github-published-resources.json || true
          git remote add cnb-read \
            https://cnb.cool/AkashaNavigator/akasha-plugins
          if git fetch cnb-read \
              catalog:refs/remotes/cnb-read/catalog; then
            git show \
              cnb-read/catalog:plugins/akasha-genshin-automation/resources.json \
              > artifacts/bettergi-blacklist/cnb-published-resources.json || true
          else
            : > artifacts/bettergi-blacklist/cnb-published-resources.json
          fi

      - name: Inspect latest stable BetterGI Release
        id: prepare
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE_SYNC: ${{ github.event_name == 'workflow_dispatch' && inputs.force }}
        run: |
          force_argument=()
          if [[ "$FORCE_SYNC" == "true" ]]; then
            force_argument+=(--force)
          fi
          python .github/scripts/sync_bettergi_blacklist.py prepare \
            --repository-root . \
            --output-directory artifacts/bettergi-blacklist \
            --plan artifacts/bettergi-blacklist/plan.json \
            --published-catalog artifacts/bettergi-blacklist/github-published-resources.json \
            --published-catalog artifacts/bettergi-blacklist/cnb-published-resources.json \
            --github-token "$GH_TOKEN" \
            "${force_argument[@]}"

      - name: Publish immutable resource asset to GitHub
        if: steps.prepare.outputs.hasUpdate == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.prepare.outputs.resourceTag }}
          ASSET_PATH: ${{ steps.prepare.outputs.assetPath }}
          ASSET_NAME: ${{ steps.prepare.outputs.assetName }}
        run: |
          checksum_path="${ASSET_PATH}.sha256"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ASSET_PATH" "$checksum_path" --clobber
          else
            gh release create "$TAG" "$ASSET_PATH" "$checksum_path" \
              --title "Akasha resource: BetterGI default pick blacklist" \
              --notes "Immutable verified data resource mirrored from a stable BetterGI Release." \
              --latest=false
          fi
          test "$(basename "$ASSET_PATH")" = "$ASSET_NAME"

      - name: Publish identical resource asset to CNB
        if: steps.prepare.outputs.hasUpdate == 'true'
        shell: bash
        env:
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
          TAG: ${{ steps.prepare.outputs.resourceTag }}
          ASSET_PATH: ${{ steps.prepare.outputs.assetPath }}
        run: |
          python .github/scripts/publish_cnb_assets.py \
            --token "$CNB_TOKEN" \
            --project AkashaNavigator/akasha-plugins \
            --tag "$TAG" \
            --name "Akasha resource: BetterGI default pick blacklist" \
            --body "Immutable verified data resource mirrored from a stable BetterGI Release." \
            --assets "$ASSET_PATH" "${ASSET_PATH}.sha256"

      - name: Poll both public mirrors until checksums converge
        if: steps.prepare.outputs.hasUpdate == 'true'
        shell: bash
        env:
          TAG: ${{ steps.prepare.outputs.resourceTag }}
          ASSET: ${{ steps.prepare.outputs.assetName }}
          EXPECTED_SHA256: ${{ steps.prepare.outputs.sha256 }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          verify_mirror() {
            local label="$1"
            local url="$2"
            local output="$3"
            for attempt in $(seq 1 30); do
              rm -f "$output"
              if curl --fail --location --silent --show-error \
                  "$url" --output "$output"; then
                actual="$(sha256sum "$output" | cut -d' ' -f1)"
                if [[ "$actual" == "$EXPECTED_SHA256" ]]; then
                  echo "$label mirror verified on attempt $attempt"
                  return 0
                fi
              fi
              sleep 10
            done
            echo "$label mirror did not converge" >&2
            return 1
          }
          verify_mirror GitHub \
            "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$ASSET" \
            github-readback.json
          verify_mirror CNB \
            "https://cnb.cool/AkashaNavigator/akasha-plugins/-/releases/download/$TAG/$ASSET" \
            cnb-readback.json

      - name: Apply verified resource metadata
        if: steps.prepare.outputs.hasUpdate == 'true'
        run: >-
          python .github/scripts/sync_bettergi_blacklist.py apply
          --repository-root .
          --plan artifacts/bettergi-blacklist/plan.json

      - name: Validate repository contracts
        if: steps.prepare.outputs.hasUpdate == 'true'
        run: |
          python build/repository_tool.py --root . validate
          python tests/validate_contracts.py

      - name: Commit source resource metadata
        if: steps.prepare.outputs.hasUpdate == 'true'
        id: commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            plugins/akasha-genshin-automation/resources.json \
            plugins/akasha-genshin-automation/resources/bettergi-blacklist-history.json
          if git diff --cached --quiet; then
            echo "No metadata change to commit"
          else
            version="$(python -c 'import json; print(json.load(open("artifacts/bettergi-blacklist/plan.json"))["upstreamReleaseTag"])')"
            git commit -m "data(automation): sync BetterGI blacklist ${version}"
            git push origin HEAD:main
          fi
          echo "sourceCommit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Prepare catalog worktree
        if: steps.prepare.outputs.hasUpdate == 'true'
        shell: bash
        env:
          CATALOG_ROOT: ${{ runner.temp }}/catalog-worktree
        run: |
          git fetch origin catalog
          git worktree add -B catalog "$CATALOG_ROOT" origin/catalog

      - name: Stage catalog with independent resource metadata
        if: steps.prepare.outputs.hasUpdate == 'true'
        shell: pwsh
        run: >-
          ./build/Publish-Catalog.ps1
          -SourceCommit "${{ steps.commit.outputs.sourceCommit }}"
          -PreviousCatalogDirectory "${{ runner.temp }}/catalog-worktree"

      - name: Publish updated catalog to GitHub and CNB
        if: steps.prepare.outputs.hasUpdate == 'true'
        shell: bash
        env:
          CATALOG_ROOT: ${{ runner.temp }}/catalog-worktree
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
          SOURCE_COMMIT: ${{ steps.commit.outputs.sourceCommit }}
        run: |
          find "$CATALOG_ROOT" -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a artifacts/catalog/. "$CATALOG_ROOT/"
          git -C "$CATALOG_ROOT" add --all
          if ! git -C "$CATALOG_ROOT" diff --cached --quiet; then
            git -C "$CATALOG_ROOT" commit -m "catalog: publish ${SOURCE_COMMIT:0:12}"
            git -C "$CATALOG_ROOT" push origin HEAD:catalog
          fi

          credential_file="$RUNNER_TEMP/cnb-git-credentials"
          cleanup_credentials() {
            rm -f "$credential_file"
            git config --global --unset-all credential.helper || true
          }
          trap cleanup_credentials EXIT
          git config --global credential.helper "store --file=$credential_file"
          printf "protocol=https\nhost=cnb.cool\nusername=cnb\npassword=%s\n\n" "$CNB_TOKEN" |
            git credential approve
          git -C "$CATALOG_ROOT" remote add cnb \
            "https://cnb.cool/AkashaNavigator/akasha-plugins"
          git -C "$CATALOG_ROOT" push cnb HEAD:catalog
